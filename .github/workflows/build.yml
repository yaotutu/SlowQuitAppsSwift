name: Build and Release

on:
  push:
    branches:
      - release-main
      - release-dev
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release macOS App
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build Release
      run: |
        xcodebuild \
          -scheme SlowQuitAppsSwift \
          -configuration Release \
          -destination 'platform=macOS' \
          -derivedDataPath ./build \
          clean build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package app
      run: |
        cd build/Build/Products/Release

        # 创建 DMG 临时目录
        mkdir -p dmg_temp
        cp -R SlowQuitAppsSwift.app dmg_temp/

        # 创建 Applications 文件夹的符号链接
        ln -s /Applications dmg_temp/Applications

        # 创建临时 DMG
        hdiutil create -volname "SlowQuitAppsSwift" -srcfolder dmg_temp -ov -format UDRW temp.dmg

        # 挂载临时 DMG 以设置窗口属性
        hdiutil attach temp.dmg -noverify -nobrowse -mountpoint /Volumes/SlowQuitAppsSwift

        # 设置 Finder 窗口属性（图标位置和窗口大小）
        echo '
          tell application "Finder"
            tell disk "SlowQuitAppsSwift"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {400, 100, 900, 450}
              set viewOptions to the icon view options of container window
              set arrangement of viewOptions to not arranged
              set icon size of viewOptions to 100
              set position of item "SlowQuitAppsSwift.app" of container window to {125, 180}
              set position of item "Applications" of container window to {375, 180}
              update without registering applications
              delay 2
              close
            end tell
          end tell
        ' | osascript

        # 卸载临时 DMG
        hdiutil detach /Volumes/SlowQuitAppsSwift

        # 转换为压缩的只读 DMG
        hdiutil convert temp.dmg -format UDZO -o SlowQuitAppsSwift.dmg
        rm temp.dmg
        rm -rf dmg_temp

        # 同时创建 ZIP（兼容性更好）
        ditto -c -k --keepParent SlowQuitAppsSwift.app SlowQuitAppsSwift.zip

        mv SlowQuitAppsSwift.dmg ${{ github.workspace }}/
        mv SlowQuitAppsSwift.zip ${{ github.workspace }}/

    - name: Generate version tag
      id: version
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        if [ "$BRANCH_NAME" = "release-main" ]; then
          VERSION="v1.0.${GITHUB_RUN_NUMBER}"
          PRERELEASE=false
        else
          VERSION="v0.1.${GITHUB_RUN_NUMBER}-dev"
          PRERELEASE=true
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
        echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## SlowQuitAppsSwift ${{ steps.version.outputs.version }}

          **构建分支:** ${{ github.ref_name }}
          **构建时间:** ${{ steps.version.outputs.timestamp }}
          **提交:** ${{ github.sha }}

          ### 安装方法

          **推荐：使用 DMG 安装**
          1. 下载 `SlowQuitAppsSwift.dmg`
          2. 双击 DMG 文件打开
          3. 将 `SlowQuitAppsSwift.app` 拖入"应用程序"文件夹
          4. 双击启动应用
          5. 在"系统设置 → 隐私与安全性 → 辅助功能"中授予权限

          **备选：使用 ZIP 安装**
          1. 下载 `SlowQuitAppsSwift.zip`
          2. 解压后将 `SlowQuitAppsSwift.app` 拖入"应用程序"文件夹
          3. 双击启动应用
          4. 在"系统设置 → 隐私与安全性 → 辅助功能"中授予权限

          ### 注意事项
          - ✅ 已签名和公证（如果配置了证书）：可以直接双击打开
          - ⚠️ 未签名版本：需要右键点击选择"打开"

          ### 变更日志
          查看完整提交历史: ${{ github.event.compare }}
        files: |
          SlowQuitAppsSwift.dmg
          SlowQuitAppsSwift.zip
        draft: false
        prerelease: ${{ steps.version.outputs.prerelease }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
